<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Волшебное зеркало</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="display.css">
</head>
<body>
  <div class="room">
    <div class="veil veil-a"></div>
    <div class="veil veil-b"></div>
    <div class="rays"></div>
    <div class="shards">
      <i style="--x:6%;  --y:-8%;  --s:46rem; --r:18deg;  --o:.07; --d:41s"></i>
      <i style="--x:62%; --y:-14%; --s:58rem; --r:-24deg; --o:.05; --d:57s"></i>
      <i style="--x:-10%;--y:46%;  --s:52rem; --r:-8deg;  --o:.06; --d:48s"></i>
      <i style="--x:74%; --y:48%;  --s:44rem; --r:32deg;  --o:.05; --d:63s"></i>
    </div>
    <div class="sparks" id="sparks"></div>

    <main class="mirror">
      <div class="mirror-glass">
        <svg class="hand" viewBox="0 0 170 232" fill="none" aria-hidden="true">
          <!-- Знак шоу: раскрытая ладонь -->
          <path fill="currentColor" d="M 57 56 A 11 11 0 0 1 79 56 L 79 116 Q 81.5 129 84 116 L 84 42
            A 12 12 0 0 1 108 42 L 108 118 Q 110 131 112 118 L 112 52
            A 11 11 0 0 1 134 52 L 134 124 Q 136 136 138 124 L 138 80
            A 10 10 0 0 1 158 80 L 158 132 C 162 150 162 170 158 184
            C 151 207 129 217 100 217 C 80 217 66 207 65.3 165.2
            C 57 175 44 184 30.3 191.2 A 14 14 0 0 1 13.7 168.8
            C 26 158 38 150 48.7 142.8 C 51 134 54 125 57 116 Z"/>
        </svg>

        <header class="crest">
          <div class="crest-line"></div>
          <div class="crest-text">
            <h1 id="title">Битва сильнейших</h1>
            <p id="subtitle">Волшебное зеркало</p>
          </div>
          <div class="crest-line"></div>
        </header>

        <section class="stage" id="stage"></section>

        <footer class="banner" id="banner" hidden></footer>
      </div>
    </main>

    <div class="offline" id="offline" hidden>Нет связи с пультом…</div>
    <div class="unmute" id="unmute" hidden>Нажмите любую клавишу, чтобы включить звук</div>
  </div>
  <script src="shared.js"></script>
  <script src="sound.js"></script>
  <script src="display.js"></script>
</body>
</html>
