<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Волшебное зеркало</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="display.css">
</head>
<body>
  <div class="room">
    <div class="veil veil-a"></div>
    <div class="veil veil-b"></div>
    <div class="rays"></div>
    <div class="shards">
      <i style="--x:6%;  --y:-8%;  --s:46rem; --r:18deg;  --o:.07; --d:41s"></i>
      <i style="--x:62%; --y:-14%; --s:58rem; --r:-24deg; --o:.05; --d:57s"></i>
      <i style="--x:-10%;--y:46%;  --s:52rem; --r:-8deg;  --o:.06; --d:48s"></i>
      <i style="--x:74%; --y:48%;  --s:44rem; --r:32deg;  --o:.05; --d:63s"></i>
    </div>
    <div class="sparks" id="sparks"></div>

    <main class="mirror">
      <div class="mirror-glass">
        <svg class="hand" viewBox="0 0 120 200" fill="none" aria-hidden="true">
          <g fill="currentColor">
            <rect x="31" y="96" width="68" height="72" rx="26"/>
            <rect x="36" y="46" width="14" height="66" rx="7" transform="rotate(-7 43 112)"/>
            <rect x="53" y="34" width="14" height="78" rx="7" transform="rotate(-1 60 112)"/>
            <rect x="70" y="42" width="14" height="70" rx="7" transform="rotate(5 77 112)"/>
            <rect x="86" y="58" width="13" height="56" rx="6.5" transform="rotate(12 92 114)"/>
            <rect x="30" y="118" width="15" height="58" rx="7.5" transform="rotate(40 37.5 126)"/>
          </g>
        </svg>

        <header class="crest">
          <div class="crest-line"></div>
          <div class="crest-text">
            <h1 id="title">Битва сильнейших</h1>
            <p id="subtitle">Волшебное зеркало</p>
          </div>
          <div class="crest-line"></div>
        </header>

        <section class="stage" id="stage"></section>

        <footer class="banner" id="banner" hidden></footer>
      </div>
    </main>

    <div class="offline" id="offline" hidden>Нет связи с пультом…</div>
    <div class="unmute" id="unmute" hidden>Нажмите любую клавишу, чтобы включить звук</div>
  </div>
  <script src="shared.js"></script>
  <script src="sound.js"></script>
  <script src="display.js"></script>
</body>
</html>
